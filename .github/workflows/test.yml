name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add Homebrew to PATH on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Install and test the Formula
        shell: bash
        run: |
          set -euo pipefail
          brew tap Aero123421/tap
          tap_dir="$(brew --repository Aero123421/tap)"
          cp "$PWD/Formula/sfh.rb" "$tap_dir/Formula/sfh.rb"
          brew install Aero123421/tap/sfh
          brew test Aero123421/tap/sfh
          sfh --version
